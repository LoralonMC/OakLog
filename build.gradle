plugins {
    id 'java'
    id("com.gradleup.shadow") version "9.3.1"
}

group = 'dev.oakheart'
version = '1.4.0'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "placeholderapi"
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }
    maven {
        name = "codemc-releases"
        url = "https://repo.codemc.io/repository/maven-releases/"
    }
    maven {
        name = "nexo-releases"
        url = "https://repo.nexomc.com/releases/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.3.build.+")
    compileOnly("me.clip:placeholderapi:2.11.6")
    compileOnly("com.github.retrooper:packetevents-spigot:2.10.0")
    compileOnly("com.nexomc:nexo:1.23")

    implementation("org.bstats:bstats-bukkit:3.1.0")
    implementation("dev.oakheart:oakheart-core:1.3.0")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

compileJava {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

shadowJar {
    relocate 'org.bstats', 'dev.oakheart.oaklog.bstats'
    relocate 'dev.oakheart.config', 'dev.oakheart.oaklog.libs.config'
    relocate 'dev.oakheart.message', 'dev.oakheart.oaklog.libs.message'
    relocate 'dev.oakheart.command', 'dev.oakheart.oaklog.libs.command'
    relocate 'dev.oakheart.util', 'dev.oakheart.oaklog.libs.util'
    archiveClassifier.set('')
}

build {
    dependsOn shadowJar
}
