# OakLog Messages
# ========================
# All messages use MiniMessage format: https://docs.advntr.dev/minimessage/format.html
# Set any message to "" to disable it
#
# Gameplay messages have text/display structure:
#   display options: chat, action_bar, title, none
#
# Command messages are flat strings under commands: (always sent via chat)
#
# Placeholders are listed in comments above each message

# ============================================================
# GAMEPLAY MESSAGES
# ============================================================

# Shown when a player collects a new entry (the primary notification)
# Placeholders: <entry>, <category>
collected-entry:
  text: "<#6C757D>[<#6B7A5E>ʟᴏɢ<#6C757D>] <#f2ebd7>Collected: <#FCD472><entry>"
  display: action_bar

# Shown when a player completes an entire Set
# Placeholders: <set>
set-complete:
  text: "<#6C757D>[<#6B7A5E>ʟᴏɢ<#6C757D>] <#f2ebd7>Set <#FCD472><set><#f2ebd7> <#8FAA87>complete<#f2ebd7>!"
  display: chat

# Shown when a player completes an entire category
# Placeholders: <category>
category-complete:
  text: "<#6C757D>[<#6B7A5E>ʟᴏɢ<#6C757D>] <#f2ebd7>Category <#FCD472><category><#f2ebd7> <#8FAA87>complete<#f2ebd7>!"
  display: chat

# Shown when a player completes the entire log
full-log-complete:
  text: "<#6C757D>[<#6B7A5E>ʟᴏɢ<#6C757D>] <#f2ebd7>You have completed the entire <#FCD472>Collection Log<#f2ebd7>!"
  display: chat

# ============================================================
# GUI TEXT
# ============================================================
# All GUI strings are parsed via MiniMessage and have <!italic> applied
# automatically by MessageManager.deserialize.

gui:
  hub:
    title: "<#6B7A5E>Collection Log"
    player-head-name: "<#FCD472><player>"
    player-head-lore: "<#f2ebd7>Collected: <#FCD472><collected><#6C757D>/<#FCD472><total> <#6C757D>(<#8FAA87><percent>%<#6C757D>)"
    category-name: "<#6B7A5E><category>"
    category-lore: "<#f2ebd7>Progress: <#FCD472><collected><#6C757D>/<#FCD472><total>"

  category:
    title: "<#6B7A5E>Collection Log <#6C757D>· <#f2ebd7><category>"

  tab:
    name: "<#f2ebd7><category>"
    active-name: "<#8FAA87>▶ <category>"

  entry:
    name-collected: "<#8FAA87><entry>"
    name-uncollected: "<#6C757D><entry>"
    lore-collected: "<#f2ebd7>Status: <#8FAA87>✓ Collected<#6C757D> · <#f2ebd7>Obtained: <#FCD472><date>"
    lore-uncollected: "<#f2ebd7>Status: <#C27B6B>✗ Not yet collected"

  button:
    recent: "<#FCD472>Recent Activity"
    sets: "<#FCD472>Sets"
    search: "<#FCD472>Search"
    leaderboard: "<#FCD472>Leaderboard"
    close: "<#C27B6B>Close"
    back: "<#FCD472>◀ Back"
    back-to-hub: "<#FCD472>◀ Back to Log"
    next-page: "<#FCD472>Next Page ▶"
    prev-page: "<#FCD472>◀ Previous Page"
    page-indicator: "<#f2ebd7>Page <#FCD472><page><#6C757D>/<#FCD472><total_pages>"
    filter-all: "<#f2ebd7>Filter: <#FCD472>All"
    filter-collected: "<#f2ebd7>Filter: <#8FAA87>Collected"
    filter-uncollected: "<#f2ebd7>Filter: <#C27B6B>Uncollected"

  recent:
    title: "<#6B7A5E>Collection Log <#6C757D>· <#f2ebd7>Recent Activity"

  sets:
    title: "<#6B7A5E>Collection Log <#6C757D>· <#f2ebd7>Sets"
    set-name: "<#FCD472><set>"
    set-lore: "<#f2ebd7>Progress: <#FCD472><collected><#6C757D>/<#FCD472><total> <#6C757D>(<#8FAA87><percent>%<#6C757D>)"

  set:
    title: "<#6B7A5E>Set <#6C757D>· <#f2ebd7><set>"

  leaderboard:
    title: "<#6B7A5E>Collection Log <#6C757D>· <#f2ebd7>Leaderboard"
    tab-total: "<#FCD472>Total"
    tab: "<#f2ebd7><category>"
    tab-active: "<#8FAA87>▶ <category>"
    entry-name: "<#FCD472>#<rank><#6C757D> · <#f2ebd7><player>"
    entry-lore: "<#f2ebd7>Collected: <#FCD472><collected><#6C757D>/<#FCD472><total> <#6C757D>(<#8FAA87><percent>%<#6C757D>)"

# ============================================================
# COMMAND MESSAGES
# ============================================================

commands:
  # Shown when console tries a player-only command
  player-only: "<#6C757D>[<#C27B6B>ᴇʀʀᴏʀ<#6C757D>] <#C27B6B>This command must be run by a player."

  # Shown when configuration is reloaded successfully
  # Placeholders: <added>, <retired>
  reload-success: "<#6C757D>[<#6B7A5E>ʟᴏɢ<#6C757D>] <#f2ebd7>Configuration <#8FAA87>reloaded<#f2ebd7>. <#FCD472><added><#f2ebd7> new entries, <#FCD472><retired><#f2ebd7> retired."

  # Shown when configuration reload fails
  reload-failed: "<#6C757D>[<#C27B6B>ᴇʀʀᴏʀ<#6C757D>] <#C27B6B>Configuration reload failed! Check console for details."

  # Shown when player lacks permission
  no-permission: "<#6C757D>[<#C27B6B>ᴇʀʀᴏʀ<#6C757D>] <#C27B6B>You don't have permission to use this command."

  # Shown when target player is not found
  player-not-found: "<#6C757D>[<#C27B6B>ᴇʀʀᴏʀ<#6C757D>] <#C27B6B>Player not found."

  # Shown for unknown entry id
  # Placeholders: <entry>
  unknown-entry: "<#6C757D>[<#C27B6B>ᴇʀʀᴏʀ<#6C757D>] <#C27B6B>Unknown entry: <#FCD472><entry><#C27B6B>."

  # Shown for unknown category
  # Placeholders: <category>
  unknown-category: "<#6C757D>[<#C27B6B>ᴇʀʀᴏʀ<#6C757D>] <#C27B6B>Unknown category: <#FCD472><category><#C27B6B>."

  # Shown for unknown set
  # Placeholders: <set>
  unknown-set: "<#6C757D>[<#C27B6B>ᴇʀʀᴏʀ<#6C757D>] <#C27B6B>Unknown set: <#FCD472><set><#C27B6B>."

  # Player help
  help-header: "<#6C757D>═══════ <#6B7A5E>OakLog <#6C757D>═══════"
  help-open: "<#FCD472>/oaklog <#6C757D>- <#f2ebd7>Open your collection log"
  help-view-other: "<#FCD472>/oaklog <player> <#6C757D>- <#f2ebd7>View another player's log"
  help-search: "<#FCD472>/oaklog search <query> <#6C757D>- <#f2ebd7>Search for entries"
  help-toast: "<#FCD472>/oaklog toast <on|off|milestones> <#6C757D>- <#f2ebd7>Toggle toast notifications"
