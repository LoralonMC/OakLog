# ============================================================
# CUSTOM ENTRY DEFINITIONS
# ============================================================
# Two ways to register custom items into the collection log:
#
# 1. `auto-discover:` patterns watch a PDC key. The first time a
#    player picks up an item carrying that key, OakLog auto-registers
#    an entry using the actual item's display name, material, and
#    custom model data. Works out of the box for any PDC-tagged
#    plugin.
#
# 2. `entries:` explicit definitions. Use this when you want to
#    define the exact namespace, key, display name, and icon ahead of
#    time — useful for items that aren't normally picked up (e.g. the
#    Shopkeepers shop creation item).
#
# Both sections are optional. Auto-discover entries appear in the log
# only after the first time someone collects them; explicit entries
# show up at startup with the configured display name even if no one
# has touched them yet.

# ============================================================
# AUTO-DISCOVER (recommended for most plugins)
# ============================================================

auto-discover:
  # OakPets, OakTags, OakTools are now handled by dedicated adapters
  # (registered in OakLog.initializeComponents). They enumerate at startup
  # so every voucher / tool shows in the log without needing first pickup.

  # PhoenixCrates — crate keys
  - namespace: phoenixcrates
    pdc-key: 'phoenixcrates:key'
    category: items

  # NekoTraps — animal trap items
  - namespace: nekotraps
    pdc-key: 'nekotraps:trap'
    category: items

# ============================================================
# EXPLICIT ENTRIES
# ============================================================
# Required fields: namespace, key, category, display-name, pdc-key
# Optional: icon-material, icon-model-data, pdc-value ("*" matches any)

entries:
  # Shopkeepers — the shop creation item (creates a player shop when used)
  - namespace: shopkeepers
    key: shop_creation_item
    category: items
    display-name: 'Shopkeeper Wand'
    icon-material: VILLAGER_SPAWN_EGG
    pdc-key: 'shopkeepers:creator'
    pdc-value: '*'

# ============================================================
# NOTES
# ============================================================
# - PDC keys are case-sensitive. Most plugins use lowercase.
# - If a plugin uses a different PDC key than the default listed
#   above, edit the entry and run `/oaklog reload`.
# - To find a plugin's PDC key: pick up one of its items, run `/oaklog
#   info ...` is not implemented yet for unknown items; check the
#   plugin's documentation or source for the NamespacedKey it uses.
