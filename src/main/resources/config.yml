# OakLog Configuration
# ========================
#
# ============================================================
# PLACEHOLDERAPI PLACEHOLDERS
# ============================================================
# If PlaceholderAPI is installed, the following placeholders are available:
#
#   %oaklog_total_collected%        - Number of entries the player has collected
#   %oaklog_total_entries%          - Total live (non-retired) entries
#   %oaklog_total_percent%          - Player's overall completion as a percentage (e.g., "37.4")
#   %oaklog_progress_<category>%    - "23/156" for the given category (blocks, items, entities, biomes, structures, effects, enchantments)
#   %oaklog_percent_<category>%     - Completion percentage for the given category
#   %oaklog_toast_state%            - "on", "off", or "milestones"
#   %oaklog_rank%                   - Player's leaderboard rank across all entries (1-based)
#
# Useful for custom menus (e.g., BetterGUI) to display log stats or build toggle buttons.

# ============================================================
# GENERAL SETTINGS
# ============================================================

# Debug mode - logs detection events to console
debug: false

# Command alias registered alongside /oaklog (set to "" to disable)
command-alias: 'log'

# ============================================================
# DETECTION
# ============================================================

detection:
  # How often (in ticks) to check the player's current biome. 20 ticks = 1 second.
  biome-check-interval: 20

  # Master switch for detecting structures the player walks into. Sampled on chunk
  # change, join, teleport and world change, plus the poll below.
  structure-check-on-chunk-change: true

  # How often (in ticks) to check whether the player is standing inside a structure.
  # Chunk-change sampling alone misses any structure small enough to sit inside one
  # chunk (igloo, desert well, swamp hut): the only sample taken lands on the chunk
  # border, never inside the structure. Set to 0 to disable the poll and go back to
  # event-only sampling. Takes effect on server restart.
  structure-check-interval: 20

  # Structures this size or smaller (in blocks, horizontally) are matched on X/Z only,
  # ignoring the height of their recorded bounding box. Vanilla's surface templates
  # (igloos are the confirmed case) place their blocks at the real terrain height but
  # save the box at the height that was sampled before the move, so on sloped ground the
  # box can be tens of blocks away from the building. X/Z are always correct. For a
  # structure a few blocks wide, standing in its column is conclusive on its own.
  # Anything larger keeps the full 3D check, so walking over a mineshaft or an ancient
  # city still doesn't collect it. Set to 0 to always require full 3D containment.
  #
  # Independently of this size rule, a box that sits entirely above the terrain is
  # treated as X/Z-only no matter how large it is: nothing generates floating in the
  # sky, so such a box is provably misplaced. That covers wider surface structures
  # (a Desert Pyramid is 21x21) without loosening anything that is genuinely
  # underground, like mineshafts, strongholds or ocean monuments.
  structure-small-footprint: 16

  # Game modes in which collection logging is suppressed. A player in one of these
  # modes won't collect anything (items, blocks, entities, biomes, structures, etc.).
  # This stops the creative inventory from trivially filling the Items/Blocks/Enchantments
  # logs, and stops spectators from auto-collecting biomes/structures by flying through them.
  # Valid values: SURVIVAL, CREATIVE, ADVENTURE, SPECTATOR. Set to [] to log in every mode.
  # Note: admin '/oaklog grant' is never affected, and a player's already-earned
  # advancements still backfill on join regardless of their current game mode.
  ignored-gamemodes:
    - CREATIVE
    - SPECTATOR

  # Materials that should NOT be trackable as Items or Blocks (creative-only or unobtainable).
  # Supports glob patterns with '*' — e.g. '*_spawn_egg' excludes every spawn egg.
  # Remove an entry to make it trackable. These materials are skipped entirely - they won't
  # appear in the log at all.
  excluded-items:
    - bedrock
    - command_block
    - chain_command_block
    - repeating_command_block
    - command_block_minecart
    - structure_block
    - structure_void
    - jigsaw
    - debug_stick
    - knowledge_book
    - barrier
    - light
    - '*_spawn_egg'
    # No-effect "default" potion / arrow variants — players can't normally obtain these
    - '*uncraftable_potion'
    - 'uncraftable_tipped_arrow'

  # Exclude specific entries by their full namespacedKey ('namespace:key').
  # Supports '*' globs.
  #
  # When an adapter recognizes an item but its entry is excluded here, OakLog
  # treats that as "do not track this item" — it will NOT fall back to logging
  # the underlying vanilla material. Use this for custom items you don't want
  # cluttering the log (GUI icons, internal templates, wrap visual references).
  #
  # The defaults below only cover vanilla unobtainable entities. Add your own
  # patterns below to exclude custom items from any installed plugin (Nexo,
  # ItemsAdder, ExecutableItems, etc.).
  #
  # Common patterns (examples — uncomment what applies to your server):
  #
  #   # HMCCosmetics UI items (only if you use HMCCosmetics):
  #   # - 'nexo:hmc_*'
  #
  #   # Nexo-shipped example items you don't use as collectibles:
  #   # - 'nexo:forest_helmet'
  #   # - 'nexo:forest_chestplate'
  #   # - 'nexo:arm_chair'
  #
  #   # Adapter redirects — if two adapters can both detect the same item,
  #   # exclude one so the other wins. E.g. excluding 'nexo:wooden_sickle'
  #   # lets the OakTools adapter's 'oaktools:sickle_wood' entry claim it.
  #
  excluded-entries:
    # ===== Entities not accessible to players in survival =====
    - 'minecraft:entity_giant'         # legacy unused mob; /summon only
    - 'minecraft:entity_illusioner'    # /summon only
    - 'minecraft:entity_mannequin'     # testing entity
    # Parrot#isBaby() is hard-coded to return false, so no parrot is ever a baby:
    # not by breeding (canMate false, getBreedOffspring null), not on spawn
    # (shouldSpawnBaby false) and not from a spawn egg.
    - 'minecraft:entity_parrot_*_baby'
    # Zombie horses spawn one per group (minCount = maxCount = 1) and the baby roll
    # in AgeableMob#finalizeSpawn only applies from the second mob of a group on, so
    # the natural spawn never yields one. They also can't breed (canFallInLove false)
    # or grow up (canAgeUp false). Spawn egg only, at 20%.
    - 'minecraft:entity_zombie_horse_baby'
    # The four unused painting variants: absent from the #placeable tag, so placing a
    # painting never rolls them, and no vanilla structure template places a painting
    # (checked all 1202 structure NBTs). The remaining 47 are obtainable.
    - 'minecraft:entity_painting_earth'
    - 'minecraft:entity_painting_wind'
    - 'minecraft:entity_painting_fire'
    - 'minecraft:entity_painting_water'

# ============================================================
# STORAGE
# ============================================================

storage:
  # SQLite database filename (relative to the plugin folder)
  filename: 'oaklog.db'

  # How often (in ticks) to flush pending collected rows to disk
  flush-interval-ticks: 200

  # Evict per-player cached progress on quit. Set to false to keep progress in memory
  # for the full server lifetime (uses more RAM but faster reconnects).
  cache-evict-on-quit: true

# ============================================================
# TOASTS
# ============================================================

toasts:
  # Default toast state for new players. Existing players keep their setting.
  # Options: on, off, milestones
  default-state: 'off'

  milestones:
    # Send a milestone toast every N entries collected in a category
    every-n-entries: 25

    # Send a toast when a Set is fully collected
    on-set-complete: true

    # Send a toast when an entire category is fully collected
    on-category-complete: true

    # Send a toast when the entire log is fully collected
    on-full-log-complete: true

# ============================================================
# SEARCH
# ============================================================

search:
  # Maximum number of results shown
  max-results: 36

# ============================================================
# LEADERBOARD
# ============================================================

leaderboard:
  # How often (in seconds) to recompute leaderboard rankings from the database
  refresh-interval-seconds: 60

  # Number of top players to show
  top-size: 10

# ============================================================
# DATE FORMATTING
# ============================================================

# Date format used when showing "collected on" timestamps in the GUI
date-format: 'yyyy-MM-dd HH:mm'

# Timezone for date display. Use "system" for the server's local timezone, or a
# ZoneId like "America/New_York" or "UTC"
date-timezone: 'system'

# ========================================
#          DO NOT EDIT BELOW
# ========================================
config-version: 1
